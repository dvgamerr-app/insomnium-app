name: Desktop build (Bun and Cargo)

on:
  workflow_dispatch:
    inputs:
      retain_packages:
        description: Store packages as unpublished draft release assets (requires contents write)
        type: boolean
        default: false
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.retain_packages
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-build-core.yml
    with:
      retain_packages: false

  retain:
    if: github.event_name == 'workflow_dispatch' && inputs.retain_packages
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-build-core.yml
    with:
      retain_packages: true
