[package]
name = "insomnium"
version = "0.1.0"
description = "Insomnium local-first API client"
authors = ["Insomnium contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "insomnium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "multipart", "cookies", "gzip", "brotli", "deflate", "stream"] }
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "net", "rt"] }
base64 = "0.22"
atomic-write-file = "0.3.1"
cookie_store = { version = "0.22.1", features = ["serde_json"] }
reqwest-websocket = "0.5.1"
eventsource-stream = "0.2.3"
futures-util = { version = "0.3.34", features = ["sink"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
http-auth = { version = "0.1.10", default-features = false }
http-body-util = "0.1"
digest_auth = "0.3.1"
unicode-normalization = "0.1.25"
percent-encoding = "2.3.2"
oauth2 = { version = "5.0.0", default-features = false, features = ["pkce-plain", "timing-resistant-secret-traits"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hmac = "0.12"
sha1 = { version = "0.10.6", features = ["oid"] }
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha1", "pem"] }
aws-sigv4 = "1.6.0"
aws-credential-types = "1.3.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
uuid = { version = "1", features = ["v4"] }
sspi = { version = "0.22.0", default-features = false }
tower = { version = "0.5", default-features = false }
x509-parser = { version = "0.18", default-features = false }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pem", "std"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots", "gzip"] }
protox = "0.9.1"
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14.6"
tokio-stream = "0.1"
prost-reflect = { version = "0.16.5", features = ["serde"] }
tonic-reflection = { version = "0.14.6", default-features = false }
ryu-js = "1.0.3"
libuv-sys2 = { version = "~1.53.0", features = ["skip-pkg-config"] }
git2 = { version = "0.21.0", features = ["https", "ssh"] }
time = "0.3"
p12-keystore = "=0.3.2"
pkcs8 = { version = "=0.11.0", features = ["encryption", "pem"] }
aes = "=0.9.3"
cbc = "=0.2.1"
des = "=0.9.0"
md-5 = "=0.11.0"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[patch.crates-io]
reqwest = { path = "vendor/reqwest" }
http-auth = { path = "vendor/http-auth" }
eventsource-stream = { path = "vendor/eventsource-stream" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target."cfg(windows)".dependencies]
uds_windows = "1.2.1"
